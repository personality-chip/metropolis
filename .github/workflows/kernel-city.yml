name: Kernel City - Windows

on:
  push:
    branches: [main, 'kernel-city/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install terminal test dependency
        run: python -m pip install pywinpty==2.0.15
      - name: Test application grouping and simulation
        run: cargo test --locked --all-targets
      - name: Build Windows release and controlled workload
        run: cargo build --locked --release --bin metropolis --example load_fixture
      - name: Verify live Windows processes and disk attribution
        run: python scripts/test_live_apps.py target/release/metropolis.exe target/release/examples/load_fixture.exe
      - name: Launch, animate, and quit in a Windows pseudoterminal
        run: python scripts/smoke_terminal.py target/release/metropolis.exe --apps
      - name: Verify classic mode still starts
        run: python scripts/smoke_terminal.py target/release/metropolis.exe
      - name: Assemble portable Windows folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/KernelCity
          Copy-Item target/release/metropolis.exe, KernelCity.cmd, LICENSE, docs/KERNEL_CITY.md dist/KernelCity/
      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: KernelCity-Windows-x64
          path: dist/KernelCity/
      - name: Upload terminal capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-terminal-capture
          path: test-output/
