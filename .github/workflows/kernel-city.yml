name: Kernel City - Windows

on:
  push:
    branches: [main, 'kernel-city/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install terminal test dependency
        run: python -m pip install pywinpty==2.0.15
      - name: Build original terminal application
        run: cargo build --locked
      - name: Launch, animate, and quit in a Windows pseudoterminal
        run: python scripts/smoke_terminal.py target/debug/metropolis.exe
      - name: Upload terminal capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-terminal-capture
          path: test-output/
